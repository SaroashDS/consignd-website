            { "@type": "Question", "name": "What is the Consignd Document Audit?", "acceptedAnswer": { "@type": "Answer", "text": "A free five-day diagnostic where a freight broker sends 25–50 real documents (rate confirmations, BOLs, PODs) and receives a written report showing what extracts cleanly, what needs human review, and whether a managed rollout is commercially worth it." } },

            { "@type": "Question", "name": "What happens when extraction isn't sure?", "acceptedAnswer": { "@type": "Answer", "text": "Low-confidence fields are flagged and routed to a human review queue. Nothing is silently guessed, and every field links back to the exact source document it came from." } },
